<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://kit.fontawesome.com/c8e4d183c2.js" crossorigin="anonymous"></script>
  <script src="index.js"></script>
</head>
<body>
  <section id="landing">
    <nav>
      <div class="nav__container">
        <img class="background-image"src="assets/movie-theater.avif" alt="">
        <ul class="nav__links">
          <li><a href="#" class="nav__link">Home</a></li>
          <li><a href="#" class="nav__link">Find your movie</a></li>
          <li><a href="#" class="nav__link nav__link btn-contact">Contact</a></li>
        </ul>
        <button class="btn__menu" onclick="openMenu()">
          <i class="fas fa-bars"></i>
        </button>
        <div class="menu__backdrop">
          <button class="btn__menu btn__menu--close" onclick="closeMenu()">
            <i class="fas fa-times"></i>
          </button>
          <ul class="menu__links">
            <li class="menu__list">
              <a href="#" class="menu__link" onclick="closeMenu()">Home</a>
            </li>
            <li class="menu__list">
              <a href="#features" class="menu__link" onclick="closeMenu()">Find your movie</a>
            </li>
            <li class="menu__list">
              <a href="#contact" class="menu__link" onclick="closeMenu()">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <header>
      <div class="header__container">
        <div class="header__description">
          <h1>The best movie library in America</h1>
                <a href="#features"></a>
        </div>
        <div class="input__wrapper">
         <input type="text" placeholder="Search for a movie..." class="input__search">
         <button class="btn__search">
          <i class="fas fa-search"></i>
         </button>
        </div>
        <figure class="header__img--wrapper">
          <img src="assets/The Terminator.jpg" alt="">
          <img src="assets/Terminator-2.jpg" alt="">
          <img src="assets/Terminator-3.jpg" alt="">
          <img src="assets/Terminator-Genisys.jpg" alt="">
          <img src="assets/Terminator-Salvation.jpg" alt="">
          <img src="assets/The Terminator-Sarah Connor Chronicles.jpg" alt="">
        </figure>
      </div>
    </header>
  </section>
    
  <main>  
</body>
</html>
